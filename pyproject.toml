[tool.pyrefly]
project-roots = [
    "."
]
search-paths = [
    ".",
    "src",
    ".venv/Lib/site-packages"
]
python-interpreter = ".venv/Scripts/python.exe"

[tool.pyright]
include = [".", "src", "tests"]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    "src",
    ".venv/Lib/site-packages"
]
